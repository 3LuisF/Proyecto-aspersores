[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspersores-logo-gui"
version = "0.1.0"
description = "Interfaz para controlar entradas VM de un LOGO! por S7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-snap7>=1.0.0",
]

[tool.setuptools]
packages = ["aspersores_logo"]
